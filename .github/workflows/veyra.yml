name: Veyra CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Code Scanning

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Veyra with dev dependencies
        run: |
          # Editable install so the Attack Lab corpus path (derived from
          # __file__) resolves to the repo's tests/fixtures/attacks/.
          pip install --quiet -e ".[dev]"

      - name: Run test suite
        run: |
          # Runs the full suite, including the Attack Lab regression tests
          # (tests/test_attack_lab.py) that guard the 95-case corpus baseline.
          pytest -q

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Veyra
        run: |
          # Install Veyra from the checked-out repository itself.
          # The package is not published on PyPI, so we install locally.
          pip install --quiet .

      - name: Run Veyra scan on production source
        id: scan
        run: |
          # Scan only production source (src/), not the Attack Lab fixtures.
          # Use the repo suppression config so the scanner does not flag its
          # own rule patterns (self-referential findings).
          # Exit code: 0 = no HIGH/CRITICAL, 1 = HIGH, 2 = CRITICAL.
          set +e
          veyra scan src --config .veyra.toml --format json > veyra-report.json
          echo "json_exit=$?" >> "$GITHUB_OUTPUT"
          veyra scan src --config .veyra.toml --format sarif > veyra-report.sarif
          echo "sarif_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          echo "--- JSON report ---"
          cat veyra-report.json

      - name: Upload Veyra JSON report
        uses: actions/upload-artifact@v4
        with:
          name: veyra-report
          path: veyra-report.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veyra-report.sarif

      - name: Fail on findings
        run: |
          # Fail the job on ACTIVE (non-suppressed) HIGH/CRITICAL findings in
          # production source, using the report's summary counts. We intentionally
          # do not use the `veyra scan` process exit code here: that exit code also
          # reflects the policy security gate (policy_status FAIL -> exit 1), which
          # fires on self-referential attack paths when scanning Veyra's own
          # detector/rule source (src/), not on real HIGH/CRITICAL findings.
          # `.veyra.toml` suppresses those self-referential rule findings (133), so
          # the summary is the correct gate: 0 active HIGH/CRITICAL -> pass.
          critical=$(python -c "import json;print(json.load(open('veyra-report.json'))['summary']['critical'])")
          high=$(python -c "import json;print(json.load(open('veyra-report.json'))['summary']['high'])")
          echo "Critical findings: $critical, High findings: $high"
          if [ "$critical" -gt 0 ]; then
            echo "::error::Veyra found CRITICAL findings in src/. See the veyra-report artifact."
            exit 2
          fi
          if [ "$high" -gt 0 ]; then
            echo "::error::Veyra found HIGH findings in src/. See the veyra-report artifact."
            exit 1
          fi
