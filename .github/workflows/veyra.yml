name: Veyra CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write   # required to upload SARIF to GitHub Code Scanning

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Veyra with dev dependencies
        run: |
          # Editable install so the Attack Lab corpus path (derived from
          # __file__) resolves to the repo's tests/fixtures/attacks/.
          pip install --quiet -e ".[dev]"

      - name: Run test suite
        run: |
          # Runs the full suite, including the Attack Lab regression tests
          # (tests/test_attack_lab.py) that guard the 95-case corpus baseline.
          pytest -q

  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Veyra
        run: |
          # Install Veyra from the checked-out repository itself.
          # The package is not published on PyPI, so we install locally.
          pip install --quiet .

      - name: Run Veyra scan on production source
        id: scan
        run: |
          # Scan only production source (src/), not the Attack Lab fixtures.
          # Use the repo suppression config so the scanner does not flag its
          # own rule patterns (self-referential findings).
          # Exit code: 0 = no HIGH/CRITICAL, 1 = HIGH, 2 = CRITICAL.
          set +e
          veyra scan src --config .veyra.toml --format json > veyra-report.json
          echo "json_exit=$?" >> "$GITHUB_OUTPUT"
          veyra scan src --config .veyra.toml --format sarif > veyra-report.sarif
          echo "sarif_exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          echo "--- JSON report ---"
          cat veyra-report.json

      - name: Upload Veyra JSON report
        uses: actions/upload-artifact@v4
        with:
          name: veyra-report
          path: veyra-report.json

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: veyra-report.sarif

      - name: Fail on findings
        run: |
          # Fail the job on HIGH/CRITICAL findings in production source
          # (exit code 1 or 2). To change the threshold, pass --fail-on to the
          # scan command above (e.g. --fail-on CRITICAL to only fail on critical).
          code="${{ steps.scan.outputs.json_exit }}"
          echo "Veyra exit code: $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::Veyra found HIGH or CRITICAL findings in src/. See the veyra-report artifact."
            exit "$code"
          fi
